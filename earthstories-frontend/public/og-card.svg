<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060f1c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec378" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4ec378" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#64a0dc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64a0dc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="80" y="300" width="1040" height="3" fill="url(#accent)"/>
  <text x="80" y="250" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff">Earth Stories</text>
